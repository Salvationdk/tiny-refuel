name: Visual Home Assistant
on:
  pull_request:
    paths: ['custom_components/**', 'tests/visual/**', '.github/workflows/visual.yml']
  push:
    branches: [main]
    paths: ['custom_components/**', 'tests/visual/**', '.github/workflows/visual.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    # First-run Playwright and Ubuntu dependencies can take >20 minutes.
    # Allow enough time for the actual 2026.11 Chromium screenshot suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/visual/requirements.txt
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/visual/requirements.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends ffmpeg libturbojpeg
      - run: .venv/bin/python tests/visual/run.py
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: tiny-refuel-visual
          path: visual-results/
          retention-days: 14
          if-no-files-found: warn
