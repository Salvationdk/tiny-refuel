name: Catalog validation pilot
on:
  pull_request:
    paths:
      - scripts/catalog_validation/**
      - .github/workflows/catalog-validation-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Offline checks against cached source pages and Yahoo HTML
        run: python scripts/catalog_validation/run_pilot.py offline
      - name: Five vehicle models on Yahoo and Gibiru (three threads)
        if: success()
        run: timeout --signal=INT --kill-after=20s 480s python -u scripts/catalog_validation/run_pilot.py live
      - name: Save reports, HTML, cache and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-validation-pilot
          path: catalog-validation-results/
          retention-days: 7
          if-no-files-found: warn
