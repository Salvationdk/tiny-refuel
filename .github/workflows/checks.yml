name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.11.2'
          - python: '3.14'
            homeassistant: '2026.10.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install homeassistant==${{ matrix.homeassistant }}
      # HA 2025.11 pins aiodns 3.5, whose annotations require pycares 4.x.
      - if: matrix.homeassistant == '2025.11.2'
        run: pip install 'pycares<5'
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.test.js
      - run: python -m compileall -q custom_components
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
