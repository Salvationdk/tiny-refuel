name: Q8 source diagnostic (temporary)
on:
  push:
    branches: [fix/q8-f24-issue-23-0.2.9]
    paths:
      - '.github/workflows/q8-source-diagnostic.yml'
      - 'scripts/q8_source_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Inspect public station price source schemas
        run: python scripts/q8_source_diagnostic.py
