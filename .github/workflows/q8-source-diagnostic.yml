name: Q8 source diagnostic (temporary)
on:
  push:
    branches: [fix/q8-f24-issue-23-0.2.9]
    paths: ['.github/workflows/q8-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check public Q8 and F24 price sources
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          urls=[
            'https://www.q8.dk/priser',
            'https://www.q8.dk/erhverv/priser/',
            'https://www.f24.dk/Station/GetStationPrices?page=1&pageSize=500',
            'https://www.q8.dk/Station/GetStationPrices?page=1&pageSize=500',
          ]
          for url in urls:
            print('\nSOURCE',url,flush=True)
            req=urllib.request.Request(url, headers={
                'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Safari/537.36',
                'Accept':'text/html,application/json;q=0.9,*/*;q=0.5',
            })
            try:
              with urllib.request.urlopen(req,timeout=15) as f:
                body=f.read(2000000).decode('utf-8','replace')
                print('HTTP',f.status,'bytes',len(body),'content-type',f.headers.get('Content-Type'),flush=True)
                for key in ('stationsPrices','GetStationPrices','GoEasy 95','22kW','kr/kWh','__NEXT_DATA__','stationName','stationPrices'):
                    pos=body.find(key)
                    print('text',key,'found',pos>=0,'at',pos,flush=True)
                    if pos>=0:
                        print('context',re.sub(r'\s+',' ',html.unescape(body[max(0,pos-120):pos+160]))[:280],flush=True)
                print('table counts',len(re.findall(r'<table\b',body,re.I)),'tr',len(re.findall(r'<tr\b',body,re.I)))
                print('scripts',re.findall(r'<script[^>]+src=["\']([^"\']+)',body,re.I)[:8])
            except urllib.error.HTTPError as e:
              print('HTTP',e.code,flush=True)
              e.close()
            except Exception as e:
              print('FAIL',type(e).__name__,str(e)[:180],flush=True)
          PY
